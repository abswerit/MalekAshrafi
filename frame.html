<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>পোস্টার জেনারেটর - আল্লামা আব্দুল মালেক আশরাফী</title>
    <style>
        body {
            font-family: 'SolaimanLipi', Arial, sans-serif;
            background-color: #f0fdf4;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            margin: 0;
        }
        h2 {
            color: #166534;
            text-align: center;
        }
        .container {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            max-width: 500px;
            width: 100%;
            text-align: center;
        }
        canvas {
            max-width: 100%;
            border: 2px solid #22c55e;
            border-radius: 5px;
            margin-top: 10px;
            cursor: move; /* ছবি মুভ করার জন্য কার্সর */
        }
        .controls {
            margin-top: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        input[type="file"] {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            width: 95%;
        }
        button {
            background-color: #15803d;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.3s;
            font-weight: bold;
        }
        button:hover {
            background-color: #166534;
        }
        .slider-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin: 10px 0;
        }
        input[type="range"] {
            flex-grow: 1;
            margin-left: 10px;
        }
        .instructions {
            font-size: 12px;
            color: #666;
            margin-top: 5px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>চেয়ার মার্কায় ভোট দিন</h2>
        <p>আপনার ছবি আপলোড করে নির্বাচনী পোস্টার তৈরি করুন</p>
        
        <input type="file" id="uploadImage" accept="image/*">
        
        <div class="controls" id="editorControls" style="display: none;">
            <div class="slider-container">
                <label>জুম করুন:</label>
                <input type="range" id="scaleSlider" min="0.5" max="3" step="0.05" value="1">
            </div>
            <p class="instructions">ছবিটি ঠিকমতো বসাতে ক্যানভাসে ড্র্যাগ (Drag) করুন</p>
        </div>

        <canvas id="photoCanvas" width="1024" height="1024"></canvas>

        <div class="controls">
            <button id="downloadBtn" style="display: none;">📥 ছবি ডাউনলোড করুন</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('photoCanvas');
        const ctx = canvas.getContext('2d');
        const uploadImage = document.getElementById('uploadImage');
        const downloadBtn = document.getElementById('downloadBtn');
        const scaleSlider = document.getElementById('scaleSlider');
        const editorControls = document.getElementById('editorControls');

        let userImg = new Image();
        let frameImg = new Image();
        
        // ফ্রেমের লোকেশন (আপনার রিপোজিটরিতে এই নামে ফাইল থাকতে হবে)
        const frameSource = './banner.png'; 

        // ডিফল্ট ভেরিয়েবল
        let scale = 1;
        let imgX = 0;
        let imgY = 0;
        let isDragging = false;
        let startX, startY;

        // ফ্রেম লোড করা
        frameImg.src = frameSource;
        frameImg.onload = () => {
            draw();
        };

        // ব্যবহারকারীর ছবি আপলোড
        uploadImage.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (event) => {
                    userImg = new Image();
                    userImg.onload = () => {
                        // ছবি মাঝখানে আনার লজিক
                        scale = 1;
                        scaleSlider.value = 1;
                        // ডিফল্টভাবে ছবিকে ক্যানভাসের সেন্টারে বসানো
                        imgX = (canvas.width - userImg.width) / 2;
                        imgY = (canvas.height - userImg.height) / 2;
                        
                        editorControls.style.display = 'block';
                        downloadBtn.style.display = 'block';
                        draw();
                    };
                    userImg.src = event.target.result;
                };
                reader.readAsDataURL(file);
            }
        });

        // ড্রয়িং ফাংশন
        function draw() {
            // ক্যানভাস পরিষ্কার করা
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // ১. সাদা ব্যাকগ্রাউন্ড দেওয়া (যাতে ট্রান্সপারেন্ট না থাকে)
            ctx.fillStyle = "#ffffff";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            if (userImg.src) {
                // ২. ব্যবহারকারীর ছবি আঁকা (স্কেলিং ও পজিশন সহ)
                ctx.save();
                // এখানে ছবির পজিশন ও স্কেল ঠিক করা হচ্ছে
                const centerX = canvas.width / 2;
                const centerY = canvas.height / 2;
                
                ctx.translate(centerX, centerY);
                ctx.scale(scale, scale);
                ctx.translate(-centerX, -centerY);
                
                ctx.drawImage(userImg, imgX + (centerX - userImg.width/2 - imgX)*(1-1/scale), imgY + (centerY - userImg.height/2 - imgY)*(1-1/scale));
                ctx.restore();
            }

            // ৩. ফ্রেমটি সবার উপরে আঁকা
            ctx.drawImage(frameImg, 0, 0, canvas.width, canvas.height);
        }

        // স্লাইডার দিয়ে জুম কন্ট্রোল
        scaleSlider.addEventListener('input', (e) => {
            scale = parseFloat(e.target.value);
            draw();
        });

        // ড্র্যাগ এবং ড্রপ (Mouse & Touch)
        canvas.addEventListener('mousedown', (e) => {
            isDragging = true;
            startX = e.clientX;
            startY = e.clientY;
        });

        canvas.addEventListener('mousemove', (e) => {
            if (isDragging) {
                const dx = e.clientX - startX;
                const dy = e.clientY - startY;
                imgX += dx; // এখানে লজিক একটু সরল করা হয়েছে
                imgY += dy;
                startX = e.clientX;
                startY = e.clientY;
                draw();
            }
        });

        canvas.addEventListener('mouseup', () => isDragging = false);
        canvas.addEventListener('mouseleave', () => isDragging = false);

        // টাচ ডিভাইসের জন্য (মোবাইল)
        canvas.addEventListener('touchstart', (e) => {
            isDragging = true;
            startX = e.touches[0].clientX;
            startY = e.touches[0].clientY;
        });

        canvas.addEventListener('touchmove', (e) => {
            if (isDragging) {
                e.preventDefault(); // স্ক্রল বন্ধ করা
                const dx = e.touches[0].clientX - startX;
                const dy = e.touches[0].clientY - startY;
                imgX += dx;
                imgY += dy;
                startX = e.touches[0].clientX;
                startY = e.touches[0].clientY;
                draw();
            }
        });

        canvas.addEventListener('touchend', () => isDragging = false);

        // ডাউনলোড ফাংশন
        downloadBtn.addEventListener('click', () => {
            const link = document.createElement('a');
            link.download = 'malek-ashrafi-poster.jpg';
            link.href = canvas.toDataURL('image/jpeg', 0.9); // হাই কোয়ালিটি JPG
            link.click();
        });
    </script>
</body>
</html>
